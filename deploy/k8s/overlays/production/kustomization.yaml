apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stratum

resources:
  - ../../base

images:
  - name: stratum-backend
    newName: ghcr.io/your-org/stratum-backend
    newTag: "1.0.0"
  - name: stratum-frontend
    newName: ghcr.io/your-org/stratum-frontend
    newTag: "1.0.0"

replicas:
  - name: stratum-backend
    count: 3
  - name: stratum-frontend
    count: 3
