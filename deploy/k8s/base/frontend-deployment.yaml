apiVersion: apps/v1
kind: Deployment
metadata:
  name: stratum-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stratum-frontend
  template:
    metadata:
      labels:
        app: stratum-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: nginx
          image: stratum-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
