# Full stack: API + SPA (+ optional observability profile).
# From repo root:
#   docker compose -f deploy/docker/docker-compose.yml up -d --build
# With Grafana/Prometheus:
#   docker compose -f deploy/docker/docker-compose.yml --profile observability up -d --build

services:
  redis:
    image: redis:7-alpine
    container_name: stratum-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stratum

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/muhammadtahamustafa-06/stratum-backend}:${BACKEND_TAG:-${APP_TAG:-latest}}
    container_name: stratum-backend
    env_file: ../../backend/.env
    environment:
      - ENVIRONMENT=production
      - METRICS_ENABLED=true
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - WHOOSH_INDEX_DIR=/app/data/whoosh_index
      # Compose stack: use sidecar Redis (overrides host-only URLs like redis://127.0.0.1)
      - RATE_LIMIT_STORAGE_URL=redis://redis:6379/0
    volumes:
      - backend_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - stratum

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/muhammadtahamustafa-06/stratum-frontend}:${FRONTEND_TAG:-${APP_TAG:-latest}}
    container_name: stratum-frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - stratum

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: stratum-prometheus
    profiles: ["observability"]
    volumes:
      - ../../observability/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - stratum
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: stratum-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ../../observability/docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - stratum
    restart: unless-stopped

volumes:
  backend_data:
    driver: local
  redis_data:
    driver: local

networks:
  stratum:
    driver: bridge
