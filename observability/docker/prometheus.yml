global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Backend running on host (Docker Desktop) — from compose network use service name `backend`
  - job_name: stratum-api
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: stratum-backend
