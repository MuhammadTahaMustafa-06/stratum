name: Deploy to Production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event.inputs.environment || 'production' }}
  # Never cancel a deploy mid pull/extract — leaves the host inconsistent and wastes work.
  cancel-in-progress: false

jobs:
  determine-changes:
    name: Determine changed services
    runs-on: ubuntu-latest
    outputs:
      previous_tag: ${{ steps.changed.outputs.previous_tag }}
      backend_changed: ${{ steps.changed.outputs.backend_changed }}
      frontend_changed: ${{ steps.changed.outputs.frontend_changed }}
      backend_tag: ${{ steps.changed.outputs.backend_tag }}
      frontend_tag: ${{ steps.changed.outputs.frontend_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        name: Detect changes since previous release tag
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG="$(git tag --sort=-creatordate 'v*.*.*' | grep -Fxv "${CURRENT_TAG}" | head -n1 || true)"
          if [[ -z "${PREVIOUS_TAG}" ]]; then
            BACKEND_CHANGED="true"
            FRONTEND_CHANGED="true"
            BACKEND_TAG="${CURRENT_TAG}"
            FRONTEND_TAG="${CURRENT_TAG}"
          else
            # Exclude backend/tests: CI covers tests; production image need not rebuild for test-only edits.
            if git diff --quiet "${PREVIOUS_TAG}" "${CURRENT_TAG}" -- backend/ ":(exclude)backend/tests" deploy/docker/docker-compose.yml; then
              BACKEND_CHANGED="false"
              BACKEND_TAG="${PREVIOUS_TAG}"
            else
              BACKEND_CHANGED="true"
              BACKEND_TAG="${CURRENT_TAG}"
            fi
            if git diff --quiet "${PREVIOUS_TAG}" "${CURRENT_TAG}" -- frontend/ deploy/docker/docker-compose.yml; then
              FRONTEND_CHANGED="false"
              FRONTEND_TAG="${PREVIOUS_TAG}"
            else
              FRONTEND_CHANGED="true"
              FRONTEND_TAG="${CURRENT_TAG}"
            fi
          fi
          {
            echo "previous_tag=${PREVIOUS_TAG}"
            echo "backend_changed=${BACKEND_CHANGED}"
            echo "frontend_changed=${FRONTEND_CHANGED}"
            echo "backend_tag=${BACKEND_TAG}"
            echo "frontend_tag=${FRONTEND_TAG}"
          } >> "${GITHUB_OUTPUT}"

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [determine-changes]
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        if: needs.determine-changes.outputs.backend_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/stratum-backend:${{ github.ref_name }}
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/stratum-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/stratum-backend:latest

      - name: Build and push frontend
        if: needs.determine-changes.outputs.frontend_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE=${{ secrets.VITE_API_BASE }}
            VITE_NEON_AUTH_URL=${{ secrets.VITE_NEON_AUTH_URL }}
            VITE_AUTH_REDIRECT_URL=${{ secrets.VITE_AUTH_REDIRECT_URL }}
            VITE_AUTH_PASSWORD_RESET_REDIRECT_URL=${{ secrets.VITE_AUTH_PASSWORD_RESET_REDIRECT_URL }}
            VITE_AUTH_REFRESH_COOKIE=${{ secrets.VITE_AUTH_REFRESH_COOKIE }}
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/stratum-frontend:${{ github.ref_name }}
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/stratum-frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/stratum-frontend:latest

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # First-time pull/extract of ~3GB+ backend image often exceeds the default 10m.
          command_timeout: 45m
          script: |
            set -euo pipefail
            cd /opt/stratum
            chmod +x deploy/docker/scripts/*.sh
            CURRENT_TAG_FILE=".deploy/current_tag"
            PREVIOUS_TAG=""
            if [ -f "${CURRENT_TAG_FILE}" ]; then
              PREVIOUS_TAG="$(cat "${CURRENT_TAG_FILE}")"
            fi
            REGISTRY_HOST="${{ secrets.DOCKER_REGISTRY }}"
            REGISTRY_HOST="${REGISTRY_HOST%%/*}"
            DOCKER_USERNAME='${{ secrets.DOCKER_USERNAME }}'
            DOCKER_PASSWORD='${{ secrets.DOCKER_PASSWORD }}'
            GRAFANA_ADMIN_USER='${{ secrets.GRAFANA_ADMIN_USER }}'
            GRAFANA_ADMIN_PASSWORD='${{ secrets.GRAFANA_ADMIN_PASSWORD }}'
            printf '%s' "${DOCKER_PASSWORD}" | docker login "${REGISTRY_HOST}" -u "${DOCKER_USERNAME}" --password-stdin
            if [[ ! -f backend/.env ]]; then
              echo "ERROR: backend/.env is missing at /opt/stratum/backend/.env"
              echo "Create it on the server with production secrets (DATABASE_URL, JWT_SECRET_KEY, CORS, etc.)."
              exit 1
            fi
            _compose_esc() { python3 -c 'import sys; sys.stdout.write(sys.argv[1].replace("$", "$$"))' "$1"; }
            export APP_TAG=${{ github.ref_name }}
            export BACKEND_IMAGE=${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/stratum-backend
            export FRONTEND_IMAGE=${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/stratum-frontend
            export BACKEND_TAG='${{ needs.determine-changes.outputs.backend_tag }}'
            export FRONTEND_TAG='${{ needs.determine-changes.outputs.frontend_tag }}'
            export GRAFANA_ADMIN_USER
            export GRAFANA_ADMIN_PASSWORD
            umask 077
            GRAFANA_USER_ESC="$(_compose_esc "${GRAFANA_ADMIN_USER}")"
            GRAFANA_PASS_ESC="$(_compose_esc "${GRAFANA_ADMIN_PASSWORD}")"
            {
              printf 'APP_TAG=%s\n' "${APP_TAG}"
              printf 'BACKEND_IMAGE=%s\n' "${BACKEND_IMAGE}"
              printf 'FRONTEND_IMAGE=%s\n' "${FRONTEND_IMAGE}"
              printf 'BACKEND_TAG=%s\n' "${BACKEND_TAG}"
              printf 'FRONTEND_TAG=%s\n' "${FRONTEND_TAG}"
              printf 'GRAFANA_ADMIN_USER=%s\n' "${GRAFANA_USER_ESC}"
              printf 'GRAFANA_ADMIN_PASSWORD=%s\n' "${GRAFANA_PASS_ESC}"
            } > deploy/docker/.env
            deploy/docker/scripts/deploy.sh
            if deploy/docker/scripts/smoke-test.sh; then
              mkdir -p .deploy
              printf '%s' "${APP_TAG}" > "${CURRENT_TAG_FILE}"
            elif [ -n "${PREVIOUS_TAG}" ]; then
              echo "Smoke tests failed. Rolling back to ${PREVIOUS_TAG}..."
              export APP_TAG_PREVIOUS="${PREVIOUS_TAG}"
              deploy/docker/scripts/rollback.sh
              echo "Rollback complete. Failing deployment job."
              exit 1
            else
              echo "Smoke tests failed and no previous tag found for rollback."
              exit 1
            fi
            deploy/docker/scripts/cleanup-docker.sh
