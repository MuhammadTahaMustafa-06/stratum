name: Deploy to Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/stratum-backend:${{ github.ref_name }}
            ${{ secrets.DOCKER_REGISTRY }}/stratum-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE=${{ secrets.VITE_API_BASE }}
            VITE_NEON_AUTH_URL=${{ secrets.VITE_NEON_AUTH_URL }}
            VITE_AUTH_REDIRECT_URL=${{ secrets.VITE_AUTH_REDIRECT_URL }}
            VITE_AUTH_PASSWORD_RESET_REDIRECT_URL=${{ secrets.VITE_AUTH_PASSWORD_RESET_REDIRECT_URL }}
            VITE_AUTH_REFRESH_COOKIE=${{ secrets.VITE_AUTH_REFRESH_COOKIE }}
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/stratum-frontend:${{ github.ref_name }}
            ${{ secrets.DOCKER_REGISTRY }}/stratum-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/stratum
            chmod +x deploy/docker/scripts/*.sh
            CURRENT_TAG_FILE=".deploy/current_tag"
            PREVIOUS_TAG=""
            if [ -f "${CURRENT_TAG_FILE}" ]; then
              PREVIOUS_TAG="$(cat "${CURRENT_TAG_FILE}")"
            fi
            export APP_TAG=${{ github.ref_name }}
            export BACKEND_IMAGE=${{ secrets.DOCKER_REGISTRY }}/stratum-backend
            export FRONTEND_IMAGE=${{ secrets.DOCKER_REGISTRY }}/stratum-frontend
            export GRAFANA_ADMIN_USER=${{ secrets.GRAFANA_ADMIN_USER }}
            export GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}
            deploy/docker/scripts/deploy.sh
            if deploy/docker/scripts/smoke-test.sh; then
              mkdir -p .deploy
              printf '%s' "${APP_TAG}" > "${CURRENT_TAG_FILE}"
            elif [ -n "${PREVIOUS_TAG}" ]; then
              echo "Smoke tests failed. Rolling back to ${PREVIOUS_TAG}..."
              export APP_TAG_PREVIOUS="${PREVIOUS_TAG}"
              deploy/docker/scripts/rollback.sh
              echo "Rollback complete. Failing deployment job."
              exit 1
            else
              echo "Smoke tests failed and no previous tag found for rollback."
              exit 1
            fi
            docker image prune -f
