name: Deploy to Production

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  determine-changes:
    name: Determine changed services
    runs-on: ubuntu-latest
    outputs:
      previous_tag: ${{ steps.changed.outputs.previous_tag }}
      backend_changed: ${{ steps.changed.outputs.backend_changed }}
      frontend_changed: ${{ steps.changed.outputs.frontend_changed }}
      backend_tag: ${{ steps.changed.outputs.backend_tag }}
      frontend_tag: ${{ steps.changed.outputs.frontend_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changed
        name: Detect changes since previous release tag
        shell: bash
        run: |
          set -euo pipefail
          
          # If manual trigger, force full build to ensure consistency
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "previous_tag=" >> "${GITHUB_OUTPUT}"
            echo "backend_changed=true" >> "${GITHUB_OUTPUT}"
            echo "frontend_changed=true" >> "${GITHUB_OUTPUT}"
            echo "backend_tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            echo "frontend_tag=${GITHUB_REF_NAME}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG="$(git tag --sort=-creatordate 'v*.*.*' | grep -Fxv "${CURRENT_TAG}" | head -n1 || true)"
          
          if [[ -z "${PREVIOUS_TAG}" ]]; then
            BACKEND_CHANGED="true"
            FRONTEND_CHANGED="true"
            BACKEND_TAG="${CURRENT_TAG}"
            FRONTEND_TAG="${CURRENT_TAG}"
          else
            # Detect backend changes
            if git diff --quiet "${PREVIOUS_TAG}" "${CURRENT_TAG}" -- backend/ ":(exclude)backend/tests" deploy/docker/docker-compose.yml; then
              BACKEND_CHANGED="false"
              BACKEND_TAG="${PREVIOUS_TAG}"
            else
              BACKEND_CHANGED="true"
              BACKEND_TAG="${CURRENT_TAG}"
            fi
            
            # Detect frontend changes
            if git diff --quiet "${PREVIOUS_TAG}" "${CURRENT_TAG}" -- frontend/ deploy/docker/docker-compose.yml; then
              FRONTEND_CHANGED="false"
              FRONTEND_TAG="${PREVIOUS_TAG}"
            else
              FRONTEND_CHANGED="true"
              FRONTEND_TAG="${CURRENT_TAG}"
            fi
          fi
          
          {
            echo "previous_tag=${PREVIOUS_TAG}"
            echo "backend_changed=${BACKEND_CHANGED}"
            echo "frontend_changed=${FRONTEND_CHANGED}"
            echo "backend_tag=${BACKEND_TAG}"
            echo "frontend_tag=${FRONTEND_TAG}"
          } >> "${GITHUB_OUTPUT}"

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [determine-changes]
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        if: needs.determine-changes.outputs.backend_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/stratum-backend:${{ github.ref_name }}
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/stratum-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/stratum-backend:latest

      - name: Build and push frontend
        if: needs.determine-changes.outputs.frontend_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE=${{ secrets.VITE_API_BASE }}
            VITE_NEON_AUTH_URL=${{ secrets.VITE_NEON_AUTH_URL }}
            VITE_AUTH_REDIRECT_URL=${{ secrets.VITE_AUTH_REDIRECT_URL }}
            VITE_AUTH_PASSWORD_RESET_REDIRECT_URL=${{ secrets.VITE_AUTH_PASSWORD_RESET_REDIRECT_URL }}
            VITE_AUTH_REFRESH_COOKIE=${{ secrets.VITE_AUTH_REFRESH_COOKIE }}
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/stratum-frontend:${{ github.ref_name }}
            ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/stratum-frontend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/stratum-frontend:latest

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          APP_TAG: ${{ github.ref_name }}
          BACKEND_TAG: ${{ needs.determine-changes.outputs.backend_tag }}
          FRONTEND_TAG: ${{ needs.determine-changes.outputs.frontend_tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 45m
          envs: DOCKER_REGISTRY,DOCKER_USERNAME,DOCKER_PASSWORD,GRAFANA_ADMIN_USER,GRAFANA_ADMIN_PASSWORD,APP_TAG,BACKEND_TAG,FRONTEND_TAG
          script: |
            set -euo pipefail
            cd /opt/stratum
            chmod +x deploy/docker/scripts/*.sh

            _on_exit() {
              local ec=$?
              if [[ "${ec}" -ne 0 ]]; then
                echo "Deploy failed (exit ${ec}); pruning dangling Docker data..."
                deploy/docker/scripts/cleanup-docker-dangling.sh || true
              fi
              exit "${ec}"
            }
            trap _on_exit EXIT

            # Login securely using env var
            REGISTRY_HOST="${DOCKER_REGISTRY%%/*}"
            printf '%s' "${DOCKER_PASSWORD}" | docker login "${REGISTRY_HOST}" -u "${DOCKER_USERNAME}" --password-stdin

            # Build production env file
            export BACKEND_IMAGE="${DOCKER_REGISTRY}/${DOCKER_USERNAME}/stratum-backend"
            export FRONTEND_IMAGE="${DOCKER_REGISTRY}/${DOCKER_USERNAME}/stratum-frontend"
            
            # Create .env for docker compose
            {
              printf 'APP_TAG=%s\n' "${APP_TAG}"
              printf 'BACKEND_IMAGE=%s\n' "${BACKEND_IMAGE}"
              printf 'FRONTEND_IMAGE=%s\n' "${FRONTEND_IMAGE}"
              printf 'BACKEND_TAG=%s\n' "${BACKEND_TAG}"
              printf 'FRONTEND_TAG=%s\n' "${FRONTEND_TAG}"
              # Note: compose files should use $${VAR} for literal $ if needed, 
              # but here we just pass the values directly.
              printf 'GRAFANA_ADMIN_USER=%s\n' "${GRAFANA_ADMIN_USER}"
              printf 'GRAFANA_ADMIN_PASSWORD=%s\n' "${GRAFANA_ADMIN_PASSWORD}"
            } > deploy/docker/.env

            deploy/docker/scripts/deploy.sh
            
            if deploy/docker/scripts/smoke-test.sh; then
              mkdir -p .deploy
              printf '%s' "${APP_TAG}" > .deploy/current_tag
            elif [ -f .deploy/current_tag ]; then
              PREV="$(cat .deploy/current_tag)"
              echo "Smoke tests failed. Rolling back to ${PREV}..."
              APP_TAG_PREVIOUS="${PREV}" deploy/docker/scripts/rollback.sh
              exit 1
            else
              echo "Smoke tests failed and no rollback target found."
              exit 1
            fi
            
            deploy/docker/scripts/cleanup-docker.sh

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure()
    steps:
      - name: Log failure diagnostic
        run: |
          echo "Deployment of ${{ github.ref_name }} failed."
          echo "Check the Actions logs for details."
