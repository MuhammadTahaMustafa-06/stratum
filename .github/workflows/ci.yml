name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'agent-transcripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'agent-transcripts/**'
      - '.github/workflows/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security — Audit & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd70802bbe2b5530737a28b03e2c385c4900c4 # v4.2.2
        with:
          fetch-depth: 0

      - name: Lint GitHub Actions
        uses: actionlint/actionlint-action@710433722e1d73c78864d78b17b629c298031268 # v1.11.1

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@85c7f8a37775f0a39a9c403f278ccda1f7b02534 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@11bd70802bbe2b5530737a28b03e2c385c4900c4 # v4.2.2
      - id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad727210f1fd89772b0de30 # v3.0.2
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/docker/docker-compose.yml'
            frontend:
              - 'frontend/**'
              - 'deploy/docker/docker-compose.yml'

  backend-quality:
    name: Backend — Quality Checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend_changed == 'true'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stratum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11bd70802bbe2b5530737a28b03e2c385c4900c4 # v4.2.2

      - uses: actions/setup-python@f677109b40527376c953a9926b484ee7e3846669 # v5.3.0
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@1bd1e32a3bdc4a25997a0f7c227920703f56e9c9 # v4.2.0
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements-ci.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint (ruff)
        run: ruff check app/ --select E,W,F,N --ignore E501

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports --no-strict-optional

      - name: Security scan (Bandit)
        run: bandit -r app/ -ll

      - name: Run tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/stratum_test
          JWT_SECRET_KEY: test-secret-key-minimum-32-characters-long
          GROQ_API_KEY: dummy-key-for-tests
          ENVIRONMENT: test
          STRICT_AUTH_CHECKS: "false"
          METRICS_ENABLED: "false"

      - name: Upload pytest junit
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b78ed2748444021 # v4.5.0
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend_changed == 'true'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11bd70802bbe2b5530737a28b03e2c385c4900c4 # v4.2.2

      - uses: actions/setup-node@1d919321301c003444c50059042d2a415663756b # v4.2.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: http://localhost:8000/api/v1

      - name: Upload build artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b78ed2748444021 # v4.5.0
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  docker-build:
    name: Docker — Build & Scan
    runs-on: ubuntu-latest
    needs: [changes, backend-quality, frontend-build]
    if: >
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.backend_changed == 'true' || needs.changes.outputs.frontend_changed == 'true') &&
      (needs.changes.outputs.backend_changed != 'true' || needs.backend-quality.result == 'success') &&
      (needs.changes.outputs.frontend_changed != 'true' || needs.frontend-build.result == 'success') &&
      needs.backend-quality.result != 'failure' &&
      needs.backend-quality.result != 'cancelled' &&
      needs.frontend-build.result != 'failure' &&
      needs.frontend-build.result != 'cancelled'

    steps:
      - uses: actions/checkout@11bd70802bbe2b5530737a28b03e2c385c4900c4 # v4.2.2

      - uses: docker/setup-buildx-action@f7ce87c5730ee151f3ef48d200151c569c76677a # v3.8.0

      - name: Build backend image
        if: needs.changes.outputs.backend_changed == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d576a9a # v6.10.0
        with:
          context: ./backend
          push: false
          tags: stratum-backend:latest
          load: true
          cache-from: |
            type=gha,scope=docker-backend-${{ github.ref_name }}
            type=gha,scope=docker-backend-main
          cache-to: type=gha,mode=min,scope=docker-backend-${{ github.ref_name }}

      - name: Scan backend image (Trivy)
        if: needs.changes.outputs.backend_changed == 'true'
        uses: aquasecurity/trivy-action@18f2510ee2a9203daee8078c5934a33119992d47 # v0.29.0
        with:
          image-ref: 'stratum-backend:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'

      - name: Build frontend image
        if: needs.changes.outputs.frontend_changed == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d576a9a # v6.10.0
        with:
          context: ./frontend
          push: false
          tags: stratum-frontend:latest
          load: true
          cache-from: |
            type=gha,scope=docker-frontend-${{ github.ref_name }}
            type=gha,scope=docker-frontend-main
          cache-to: type=gha,mode=min,scope=docker-frontend-${{ github.ref_name }}

      - name: Scan frontend image (Trivy)
        if: needs.changes.outputs.frontend_changed == 'true'
        uses: aquasecurity/trivy-action@18f2510ee2a9203daee8078c5934a33119992d47 # v0.29.0
        with:
          image-ref: 'stratum-frontend:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
