name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'agent-transcripts/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'agent-transcripts/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Security — Audit & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Lint GitHub Actions
        uses: reviewdog/action-actionlint@f63ef4e542f638063a94f6f19934e62a39626359 # v1.58.0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e7a027376a9170366b567b45d25e01f01c4062a4 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/docker/docker-compose.yml'
            frontend:
              - 'frontend/**'
              - 'deploy/docker/docker-compose.yml'

  backend-quality:
    name: Backend — Quality Checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend_changed == 'true'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stratum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@0ad303f1b31170d10d96d39600e008479e099a9b # v4.1.1
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements-ci.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint (ruff)
        run: ruff check app/ ingestion/ tools/ --select E,W,F,N --ignore E501

      - name: Type check (mypy)
        run: mypy app/ ingestion/ tools/ --ignore-missing-imports --no-strict-optional

      - name: Security scan (Bandit)
        run: bandit -r app/ ingestion/ tools/ -ll

      - name: Run tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/stratum_test
          JWT_SECRET_KEY: test-secret-key-minimum-32-characters-long
          GROQ_API_KEY: dummy-key-for-tests
          ENVIRONMENT: test
          STRICT_AUTH_CHECKS: "false"
          METRICS_ENABLED: "false"

      - name: Upload pytest junit
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend_changed == 'true'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@1d119996370159426b7ca23c41d316c736dac320 # v4.3.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: http://localhost:8000/api/v1

      - name: Upload build artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  docker-build:
    name: Docker — Build & Scan
    runs-on: ubuntu-latest
    needs: [changes, backend-quality, frontend-build]
    if: >
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.backend_changed == 'true' || needs.changes.outputs.frontend_changed == 'true') &&
      (needs.changes.outputs.backend_changed != 'true' || needs.backend-quality.result == 'success') &&
      (needs.changes.outputs.frontend_changed != 'true' || needs.frontend-build.result == 'success') &&
      needs.backend-quality.result != 'failure' &&
      needs.backend-quality.result != 'cancelled' &&
      needs.frontend-build.result != 'failure' &&
      needs.frontend-build.result != 'cancelled'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51996fabfe649 # v3.10.0

      - name: Build backend image
        if: needs.changes.outputs.backend_changed == 'true'
        uses: docker/build-push-action@48aba3b46d1a1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ./backend
          push: false
          tags: stratum-backend:latest
          load: true
          cache-from: |
            type=gha,scope=docker-backend-${{ github.ref_name }}
            type=gha,scope=docker-backend-main
          cache-to: type=gha,mode=min,scope=docker-backend-${{ github.ref_name }}

      - name: Scan backend image (Trivy)
        if: needs.changes.outputs.backend_changed == 'true'
        uses: aquasecurity/trivy-action@18f2510ee43ff8da059784373a6520192b8c0724 # v0.29.0
        with:
          image-ref: 'stratum-backend:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          trivyignore: '.trivyignore'

      - name: Build frontend image
        if: needs.changes.outputs.frontend_changed == 'true'
        uses: docker/build-push-action@48aba3b46d1a1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: ./frontend
          push: false
          tags: stratum-frontend:latest
          load: true
          cache-from: |
            type=gha,scope=docker-frontend-${{ github.ref_name }}
            type=gha,scope=docker-frontend-main
          cache-to: type=gha,mode=min,scope=docker-frontend-${{ github.ref_name }}

      - name: Scan frontend image (Trivy)
        if: needs.changes.outputs.frontend_changed == 'true'
        uses: aquasecurity/trivy-action@18f2510ee43ff8da059784373a6520192b8c0724 # v0.29.0
        with:
          image-ref: 'stratum-frontend:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          trivyignore: '.trivyignore'
