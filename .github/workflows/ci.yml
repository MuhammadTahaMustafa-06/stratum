name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'agent-transcripts/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'agent-transcripts/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend-lint-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.backend_changed == 'true'
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stratum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Lint with ruff
        run: ruff check app/ --select E,W,F,N --ignore E501

      - name: Type check
        run: mypy app/ --ignore-missing-imports --no-strict-optional

      - name: Run tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/stratum_test
          JWT_SECRET_KEY: test-secret-key-minimum-32-characters-long
          GROQ_API_KEY: dummy-key-for-tests
          ENVIRONMENT: test
          STRICT_AUTH_CHECKS: "false"
          METRICS_ENABLED: "false"

      - name: Upload pytest junit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml

  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend_changed == 'true'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: http://localhost:8000/api/v1

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  docker-build:
    name: Docker — Build Images
    runs-on: ubuntu-latest
    needs: [changes, backend-lint-test, frontend-build]
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.backend_changed == 'true' || needs.changes.outputs.frontend_changed == 'true')

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        if: needs.changes.outputs.backend_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: stratum-backend:latest

      - name: Build frontend image
        if: needs.changes.outputs.frontend_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: stratum-frontend:latest

  secrets-scan:
    name: Security — Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
